packages:
  - apps/*
  - packages/*
  - '!packages/node'
  - '!packages/agents'
  - '!packages/vinext'
  - '!packages/workers-sdk'
  - '!packages/capnweb'
  - '!packages/capnweb/packages/*'
  - '!packages/cli'
  - '!packages/cli/packages/*'
  - '!packages/mcp'
  - '!packages/workerd'
  - '!packages/workerd/npm/*'
  - '!packages/node/packages/react-screenshot-worker'
  - '!packages/workers-rs'
  - packages/capnweb/packages/*
  - packages/cli/packages/*
  - packages/node/packages/*
  - packages/workerd/npm/*
  - packages/server/src/emails
  - web
  - web/apps/*

linkWorkspacePackages: true
preferWorkspacePackages: true
strictDepBuilds: false

catalog:
  clsx: '2.1.1'
  happy-dom: '21.0.4'
  '@oxlint/plugins': '1.93.0'
  '@phosphor-icons/react': '2.1.10'
  playwright: '1.65.0'
  react: '19.3.1'
  react-dom: '19.3.1'
  tailwindcss: '4.3.5'
  '@tailwindcss/cli': '4.3.5'
  '@tailwindcss/vite': '4.3.5'
  tailwind-merge: '3.7.0'
  tsx: '4.23.15'
  typescript: '7.0.2'
  '@types/node': '26.6.6'
  '@types/react': '19.3.0'
  '@types/react-dom': '19.3.0'
  vite: '8.3.7'
  vite-plus: '1.5.1'
  vitest: '5.1.0'
  '@vitest/browser-playwright': '5.1.0'
  '@vitest/ui': '5.1.0'
  wrangler: '4.159.0'

allowBuilds:
  '@parcel/watcher': set this to true or false
  '@scarf/scarf': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  '@vscode/vsce-sign': true
  bcrypt: true
  core-js: true
  core-js-pure: true
  cpu-features: true
  electron-winstaller: true
  esbuild: true
  free-email-domains: true
  msgpackr-extract: true
  msw: set this to true or false
  node-pty: true
  protobufjs: true
  sharp: true
  ssh2: true
  tree-sitter: true
  tree-sitter-json: true
  workerd: set this to true or false

onlyBuiltDependencies:
  - '@scarf/scarf'
  - '@tree-sitter-grammars/tree-sitter-yaml'
  - '@vscode/vsce-sign'
  - bcrypt
  - core-js
  - core-js-pure
  - cpu-features
  - electron-winstaller
  - esbuild
  - free-email-domains
  - msgpackr-extract
  - node-pty
  - protobufjs
  - sharp
  - ssh2
  - tree-sitter
  - tree-sitter-json

overrides:
  '@better-fetch/fetch': 1.3.1
  '@types/react': 18.3.5
  '@types/react-dom': 18.3.0
  better-call: 1.3.7
  esbuild: 0.20.2
  protobufjs: '>=7.5.5 <8.0.0'
  react: 19.2.7
  react-dom: 19.2.7
  tar: '>=7.5.19 <8.0.0'

peerDependencyRules:
  ignoreMissing:
    - prisma
    - '@prisma/client'
    - '@prisma/engines'
    - '@electric-sql/pglite'
    - typescript
    - drizzle-kit
minimumReleaseAgeExclude:
  - '@zenthcloud/workerd-darwin-64@1.20261109.1'
  - '@zenthcloud/workerd-darwin-arm64@1.20261109.1'
  - '@zenthcloud/workerd-linux-64@1.20261109.1'
  - '@zenthcloud/workerd-linux-arm64@1.20261109.1'
  - '@zenthcloud/workerd-windows-64@1.20261109.1'
  - '@oxlint/plugins@1.93.0'
  - '@rolldown/binding-android-arm-eabi@1.2.18'
  - '@rolldown/binding-android-arm64@1.2.18'
  - '@rolldown/binding-darwin-arm64@1.2.18'
  - '@rolldown/binding-darwin-x64@1.2.18'
  - '@rolldown/binding-freebsd-x64@1.2.18'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.18'
  - '@rolldown/binding-linux-arm64-gnu@1.2.18'
  - '@rolldown/binding-linux-arm64-musl@1.2.18'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.18'
  - '@rolldown/binding-linux-s390x-gnu@1.2.18'
  - '@rolldown/binding-linux-x64-gnu@1.2.18'
  - '@rolldown/binding-linux-x64-musl@1.2.18'
  - '@rolldown/binding-openharmony-arm64@1.2.18'
  - '@rolldown/binding-win32-arm64-msvc@1.2.18'
  - '@rolldown/binding-win32-x64-msvc@1.2.18'
  - '@voidzero-dev/vite-plus-core@1.5.1'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.5.1'
  - '@voidzero-dev/vite-plus-darwin-x64@1.5.1'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.5.1'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.5.1'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.5.1'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.5.1'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.5.1'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.5.1'
  - miniflare@5.20261109.0-beta
  - rolldown@1.2.18
  - vite-plus@1.5.1
  - vite@8.3.7
  - workerd@1.20261109.1
  - wrangler@4.159.0
