http:
  routers:
    zenthcloud-router-app:
      rule: Host(`zenthcloud.docker.localhost`) && PathPrefix(`/`)
      service: zenthcloud-service-app
      entryPoints:
        - web
  services:
    zenthcloud-service-app:
      loadBalancer:
        servers:
          - url: http://zenthcloud:3000
        passHostHeader: true
