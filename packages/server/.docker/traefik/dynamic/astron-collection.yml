http:
  routers:
    guilderia-router-app:
      rule: Host(`guilderia.docker.localhost`) && PathPrefix(`/`)
      service: guilderia-service-app
      entryPoints:
        - web
  services:
    guilderia-service-app:
      loadBalancer:
        servers:
          - url: http://guilderia:3000
        passHostHeader: true
