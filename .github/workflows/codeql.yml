name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, Monday 03:23 UTC. Off the hour on purpose: the top of the hour is
    # when every other scheduled workflow on GitHub runs.
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub Actions workflows.
          - language: actions
            build-mode: none
          # TypeScript/JS: CodeQL extracts the sources directly, so `none` build
          # mode is correct. The workspace dependencies (pnpm) are not needed,
          # which keeps the analysis independent of the lockfile.
          - language: javascript-typescript
            build-mode: none
          # Go: the only module lives in apps/monitoring, so autobuild from the
          # repository root cannot find it. Build it explicitly below.
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/monitoring/go.mod
          cache-dependency-path: apps/monitoring/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Dependency vendoring is not used: the TypeScript analysis reads
          # sources directly and the Go module downloads its own dependencies.
          queries: security-extended,security-and-quality

      - name: Build Go module
        if: matrix.language == 'go'
        working-directory: apps/monitoring
        run: go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
